name: Build

on:
  push:
  pull_request:

jobs:
  build-cmake:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libhiredis-dev libuv1-dev cmake build-essential

    - name: Configure
      run: cmake -B build -D CMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build

    - name: Install
      run: sudo cmake --install build

    - name: Verify installation
      run: |
        test -f /usr/local/bin/ccache-storage-redis
        test -L /usr/local/bin/ccache-storage-rediss
